# GR00T N1.6 Client Configuration
# Configuration for the GR00T inference client node

/alfie/groot_client:
  ros__parameters:
    # ==========================================================================
    # Transport Configuration
    # ==========================================================================
    # Transport type: "ipc" for on-device, "tcp" for remote server
    #   - ipc: ~1ms latency, use for on-device inference (recommended)
    #   - tcp: ~2-5ms latency, use for remote PC server
    transport: "tcp"

    # TCP settings (only used when transport: "tcp")
    server_host: "127.0.0.1"
    server_port: 5555

    # IPC settings (only used when transport: "ipc")
    # Socket path for Unix domain socket
    ipc_path: "/tmp/groot_inference.sock"

    # ==========================================================================
    # Async ZMQ (PUSH/PULL) — used for live robot inference
    # ==========================================================================
    # When enabled, observations are pushed non-blocking and actions arrive
    # asynchronously, decoupling observation delivery from inference latency.
    # When disabled, uses synchronous REQ/REP (classic mode).
    use_async_zmq: true

    # PUSH port: client → server observations (server binds PULL on this port)
    async_push_port: 5556

    # PULL port: server → client actions (server binds PUSH on this port)
    async_pull_port: 5557

    # ==========================================================================
    # Inference Settings
    # ==========================================================================
    # Inference timeout in milliseconds
    # If server doesn't respond within this time, the request fails
    inference_timeout_ms: 5000

    # Action chunk size: must equal the checkpoint's horizon
    # (alfiebot_config.ACTION_HORIZON = 32; 2.1 s at 15 FPS).
    action_chunk_size: 32

    # Rate the training data was resampled to (rosbag_to_groot.py --fps).
    # One action step = 1/training_fps (66.7 ms at 15 FPS). Also the sample
    # rate for the butterworth/savgol smoother.
    training_fps: 15.0

    # n_action_steps: how many predicted actions to execute per chunk before
    # promoting the next pending chunk. 4 = 267 ms, re-planning at ~2.5 Hz;
    # the rest of the 32-step chunk is RTC overlap and overflow.
    n_action_steps: 4

    # Universal latency skip: all body parts read from action[skip + idx] to
    # compensate for observation-to-action delay. The N1.7 INT8 pipeline on
    # the Orin answers in ~110-130 ms with 4 denoising steps = 2 steps at 15 FPS.
    # With skip=2 and n_action_steps=4 the execution window is actions[2:6].
    latency_skip: 2

    # Inference trigger step: fire inference at this step within the execution
    # window. Equal to n_action_steps = fire at exhaust; overflow actions [6:32]
    # (1.7 s) bridge the RTT. Firing mid-chunk is only safe with RTC on, which
    # keeps the new chunk consistent with what is still being executed.
    inference_trigger_step: 4

    # Chunk transition blend steps: blend joints (not base velocity) from
    # the previous chunk's last executed action to the new chunk's trajectory
    # over N steps (~200ms for 2). Prevents joint position jumps at boundaries.
    # 0 = disabled (rate-limited interpolator handles smoothing instead).
    chunk_blend_steps: 0
    # Real-Time Chunking: send the committed future with each observation so the
    # server (started with --rtc, >= 4 denoising steps) inpaints the new chunk to
    # agree with it. Frozen steps = latency_skip (+1 if chunk_blend_steps > 0).
    rtc_enabled: true
    rtc_overlap_steps: 6  # frozen 2 + 4 ramp steps; must exceed the frozen count


    # ==========================================================================
    # Task Configuration
    # ==========================================================================
    # Language instruction sent to the model for conditioning
    task_description: "find the can and pick it up"

    # ==========================================================================
    # Safety Settings
    # ==========================================================================
    # Enable joint position and velocity limit enforcement
    enable_safety_limits: true

    # EMA smoothing coefficients (0-1) for temporal ensembling output.
    # In continuous mode, applied inside ChunkBuffer after ensembling.
    # Lower = more smoothing (more weight on previous output).
    # Sweep tested: alpha=0.3 achieves 0.46x jerk ratio (see SMOOTHIT.md).
    base_smoothing_alpha: 1.0
    joint_smoothing_alpha: 0.3

    # Inter-action interpolation: smooth 100Hz output by interpolating
    # between consecutive actions in the chunk. Superseded by rate-limited
    # interpolator when rate_limit_enabled=true.
    interpolate_actions: true

    # CSV log path for action diagnostics (empty = disabled)
    # Logs raw, smoothed, final actions and state at 100 Hz
    csv_log_path: "/tmp/groot_client_debug.csv"

    # ==========================================================================
    # Rate-Limited Interpolation (G1-style, Phase A-1)
    # ==========================================================================
    # When enabled, position-commanded joints (arms, grippers, head, back)
    # pass through a velocity-capped interpolator that prevents discontinuous
    # jumps at chunk boundaries. Replaces ActionInterpolator for classic mode.
    # Inspired by G1 WholeBodyControl's InterpolationPolicy.
    rate_limit_enabled: true

    # Per-body-part max speeds (rad/s for joints, m/s for back).
    # Software limit should be at or below hardware servo speed for
    # predictable behavior. Rate limiter is the active constraint;
    # hardware servo speed is the safety backstop.
    rate_limit_back: 0.3            # m/s — slow, heavy linear actuator
    rate_limit_left_arm: 2.0        # rad/s — fast for manipulation
    rate_limit_left_gripper: 3.0    # rad/s — quick open/close
    rate_limit_right_arm: 2.0       # rad/s
    rate_limit_right_gripper: 3.0   # rad/s
    rate_limit_head: 1.0            # rad/s — slow, smooth tracking

    # ==========================================================================
    # Per-Joint Deadband Filter
    # ==========================================================================
    # Suppresses inference jitter by ignoring target changes smaller than
    # the threshold. Position joints: if |new - current| < deadband, keep old.
    # Base velocity: snap to zero if |vel| < deadband.
    # 0.0 = disabled (default). See DEADBAND_ANALYSIS.md for tuning rationale.
    deadband_back: 0.0              # m — back position deadband
    deadband_left_arm: 0.05          # rad — left arm joint deadband
    deadband_left_gripper: 0.05      # rad — left gripper deadband
    deadband_right_arm: 0.05         # rad — right arm joint deadband
    deadband_right_gripper: 0.05     # rad — right gripper deadband
    deadband_head: 0.05              # rad — head joint deadband
    deadband_base_linear: 0.0       # m/s — base linear velocity deadband
    deadband_base_angular: 0.0      # rad/s — base angular velocity deadband

    # ==========================================================================
    # Base Velocity Limits (BEHAVIOR R1Pro-inspired, Phase A-2)
    # ==========================================================================
    # Magnitude capping + acceleration limiting for the mecanum base.
    # Physics-based, no phase lag (unlike EMA).
    # BEHAVIOR R1Pro uses ±[0.75, 0.75, 1.0] for a larger robot;
    # Alfie values are more conservative for indoor navigation.
    max_base_linear_x: 0.15      # m/s — forward/backward
    max_base_linear_y: 0.15      # m/s — strafe
    max_base_angular_z: 0.8      # rad/s — rotation
    max_base_linear_accel: 0.3   # m/s² — limits jerk on velocity changes
    max_base_angular_accel: 1.5  # rad/s² — limits rotational jerk

    # ==========================================================================
    # Per-Joint Servo Configuration (Phase A-3)
    # ==========================================================================
    # Hardware servo speed/acceleration/torque per body-part group.
    # The servo firmware velocity-limits to these values as a safety backstop.
    # Software rate limiter (above) should be the active constraint.
    servo_speed_arms: 2.0          # rad/s
    servo_speed_grippers: 3.0      # rad/s
    servo_speed_head: 1.0          # rad/s
    servo_accel_arms: 5.0          # rad/s²
    servo_accel_grippers: 8.0      # rad/s²
    servo_accel_head: 3.0          # rad/s²
    # Torque limit, 0-1 fraction of max (scaled to the 0..1000 servo register).
    # Grippers must stay well under the servo's 0.8 overload threshold so a
    # squeeze holds instead of tripping auto e-stop; command_mux also caps them.
    servo_torque_arms: 1.0
    servo_torque_grippers: 0.3
    servo_torque_head: 0.5

    # ==========================================================================
    # Real-Time Chunking (RTC)
    # ==========================================================================
    # RTC is a server-side feature — NOT configured here. Enable it by
    # starting the inference server with --rtc:
    #   python3 groot_inference_server.py --rtc ...
    # The client automatically sends prev_actions when RTC is active.
    # RTC freeze+inpaints the action prefix during denoising for smooth
    # chunk transitions. See SMOOTHIT.md for benchmark results.

    # ==========================================================================
    # Continuous Inference & Temporal Ensembling
    # ==========================================================================
    # When enabled, inference runs continuously (always churning) and chunks
    # are combined via temporal ensembling in a rolling ChunkBuffer.
    # When disabled (default), uses classic overlapped execution model.
    continuous_inference: true

    # Temporal ensembling strategy for combining overlapping chunk predictions:
    #   'latest'    — only use most recent chunk (baseline, matches classic behavior)
    #   'uniform'   — equal weight to all overlapping chunks
    #   'recency'   — linear decay favoring newer chunks
    #   'exp_decay' — ACT-style: w = exp(-decay_m * k), k = action index offset
    #   'triangle'  — peak weight at start of chunk, linear taper
    smoothing_strategy: "exp_decay"

    # Exponential decay parameter for 'exp_decay' strategy
    # Smaller = gentler decay (more averaging), larger = stronger recency bias
    smoothing_decay_m: 0.01

    # Maximum chunks to retain in the rolling buffer
    max_buffer_chunks: 8

    # ==========================================================================
    # Post-Ensembling Filter & Interpolation
    # ==========================================================================
    # Causal filter applied to the training-rate (10 FPS) ensembled output BEFORE interpolation.
    #   'none'        — no post-processing (default)
    #   'savgol'      — Savitzky-Golay polynomial smoothing (preserves trajectory shape)
    #   'butterworth' — low-pass filter (frequency-domain cutoff)
    smoothing_method: "butterworth"

    # Savitzky-Golay parameters (only used when smoothing_method: "savgol")
    savgol_window: 5          # Window size (must be odd, >= 3)
    savgol_polyorder: 2       # Polynomial order (< window)

    # Butterworth parameters (only used when smoothing_method: "butterworth")
    butterworth_order: 2      # Filter order
    butterworth_cutoff_hz: 3.0  # Cutoff (Hz), must be < training_fps/2. 3Hz was optimal at 15 FPS (SMOOTHIT.md)

    # Interpolation method for upsampling training rate (10 FPS) → 100 Hz:
    #   'linear'       — linear lerp between consecutive actions (current default)
    #   'cubic_spline' — C2-continuous cubic spline through waypoints (smoother)
    # Only used when rate_limit_enabled=false (legacy fallback).
    interpolation_method: "cubic_spline"
    spline_window: 6          # Waypoints for spline fitting (only for cubic_spline)

    # ==========================================================================
    # Back Initialization
    # ==========================================================================
    # Height (meters) to move the back to on startup (0.0 to 0.350).
    # Waits for robot_init (bringup) to calibrate the back first; never calibrates itself.
    # Set to -1.0 to disable back initialization entirely.
    back_init_height: 0.1

    # ==========================================================================
    # Debug Settings
    # ==========================================================================
    # Save first few observation images to /tmp/groot_debug_images/ for
    # visual comparison with training data (helps diagnose domain gap)
    debug_save_images: true
