# GR00T N1.6 Client Configuration
# Configuration for the GR00T inference client node

/alfie/groot_client:
  ros__parameters:
    # ==========================================================================
    # Transport Configuration
    # ==========================================================================
    # Transport type: "ipc" for on-device, "tcp" for remote server
    #   - ipc: ~1ms latency, use for on-device inference (recommended)
    #   - tcp: ~2-5ms latency, use for remote PC server
    transport: "tcp"

    # TCP settings (only used when transport: "tcp")
    server_host: "192.168.50.201"
    server_port: 5555

    # IPC settings (only used when transport: "ipc")
    # Socket path for Unix domain socket
    ipc_path: "/tmp/groot_inference.sock"

    # ==========================================================================
    # Inference Settings
    # ==========================================================================
    # Inference timeout in milliseconds
    # If server doesn't respond within this time, the request fails
    inference_timeout_ms: 5000

    # Action chunk size — always 16 (must match training horizon)
    action_chunk_size: 16

    # n_action_steps: how many of the 16 predicted actions to execute
    # per chunk before promoting the next pending chunk.
    # With overlapped inference (inference fires mid-chunk at trigger step):
    #   8 = 536ms per chunk, ~1.87 Hz re-planning, near-zero dead time
    #  16 = sequential mode (1.07s, 0.75 Hz, 270ms dead time per cycle)
    n_action_steps: 8

    # Universal latency skip: all body parts read from action[skip + idx]
    # to compensate for observation-to-action delay (~280ms = 4 steps at 15 FPS).
    # Phase 0 validated: r>0.91 for all body parts at k=4.
    # With skip=4 and n_action_steps=8, execution window is actions[4:12].
    latency_skip: 4

    # Inference trigger step: fire inference at this step within the execution
    # window for overlapped execution. With n_action_steps=8 and trigger=2,
    # inference fires at 134ms into the chunk. This gives pending chunks
    # enough time to arrive before n_action_steps exhausts (134+400=534ms < 536ms).
    # Set equal to n_action_steps for sequential mode.
    inference_trigger_step: 2

    # Chunk transition blend steps: blend joints (not base velocity) from
    # the previous chunk's last executed action to the new chunk's trajectory
    # over N steps (~134ms for 2). Prevents joint position jumps at boundaries.
    # 0 = disabled.
    chunk_blend_steps: 0

    # ==========================================================================
    # Task Configuration
    # ==========================================================================
    # Language instruction sent to the model for conditioning
    task_description: "find the can and pick it up"

    # ==========================================================================
    # Safety Settings
    # ==========================================================================
    # Enable joint position and velocity limit enforcement
    enable_safety_limits: true

    # EMA smoothing coefficients (0-1). Higher = less smoothing.
    # Base velocity: 1.0 = no smoothing (recommended, interpolation handles it)
    # Joint positions: 0.95 = near pass-through for stability
    base_smoothing_alpha: 1.0
    joint_smoothing_alpha: 1.0


    # Inter-action interpolation: smooth 100Hz output by interpolating
    # between consecutive actions in the chunk.
    interpolate_actions: true

    # CSV log path for action diagnostics (empty = disabled)
    # Logs raw, smoothed, final actions and state at 100 Hz
    csv_log_path: "/tmp/groot_client_debug.csv"

    # ==========================================================================
    # Back Initialization
    # ==========================================================================
    # Height (meters) to move the back to on startup (0.0 to 0.390).
    # Will calibrate the back first if not already calibrated.
    # Set to -1.0 to disable back initialization entirely.
    back_init_height: 0.1

    # ==========================================================================
    # Debug Settings
    # ==========================================================================
    # Save first few observation images to /tmp/groot_debug_images/ for
    # visual comparison with training data (helps diagnose domain gap)
    debug_save_images: true
