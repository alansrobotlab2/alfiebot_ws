# GR00T N1.6 Client Configuration
# Configuration for the GR00T inference client node

/alfie/groot_client:
  ros__parameters:
    # ==========================================================================
    # Transport Configuration
    # ==========================================================================
    # Transport type: "ipc" for on-device, "tcp" for remote server
    #   - ipc: ~1ms latency, use for on-device inference (recommended)
    #   - tcp: ~2-5ms latency, use for remote PC server
    transport: "tcp"

    # TCP settings (only used when transport: "tcp")
    server_host: "192.168.50.201"
    server_port: 5555

    # IPC settings (only used when transport: "ipc")
    # Socket path for Unix domain socket
    ipc_path: "/tmp/groot_inference.sock"

    # ==========================================================================
    # Inference Settings
    # ==========================================================================
    # Max inference rate (FPS) — ceiling to avoid flooding WiFi/TCP
    # Server inference time is the floor; this caps the max send rate
    # Command publishing always runs at 100 Hz regardless of this setting
    target_fps: 6

    # Inference timeout in milliseconds
    # If server doesn't respond within this time, the request fails
    inference_timeout_ms: 5000

    # Action chunking - step through the 16-action horizon sequentially
    # at the training data rate (15 FPS = 67ms per action).
    # When enabled, inference runs continuously and each new chunk
    # immediately replaces the previous one.
    action_chunk_enabled: true
    action_chunk_size: 16     # Execute first N of 16 actions (1-16)

    # ==========================================================================
    # Task Configuration
    # ==========================================================================
    # Language instruction sent to the model for conditioning
    task_description: "find the can and pick it up"

    # ==========================================================================
    # Safety Settings
    # ==========================================================================
    # Enable joint position and velocity limit enforcement
    enable_safety_limits: true

    # Action smoothing - Exponential moving average coefficient (0-1)
    # Higher = less smoothing, more responsive
    # Lower = more smoothing, smoother but laggier
    action_smoothing_alpha: 0.85

    # Maximum allowed joint position change per command cycle (radians)
    # With ABSOLUTE actions, servos self-limit via target_speed/acceleration,
    # so this is a safety backstop. 0.5 rad at 100Hz = 50 rad/s theoretical max.
    # Base velocity scale-down factor (0-1). Applied as v *= (1 - decay).
    # 0.0 = no change, 0.1 = 10% reduction, helps fine-tune approach distance.
    base_velocity_decay: 0.2

    max_joint_delta: 2.0

    # Latency compensation: skip first N actions from new chunks to account
    # for observation-to-action delay (~160ms). Each action = 67ms.
    # 2 = skip 134ms (good starting point). 0 = disabled.
    latency_skip_actions: 2

    # Chunk blending: crossfade window (in actions) at chunk boundaries.
    # Prevents discontinuities that cause hand twitching.
    # 4 actions = ~268ms blend. 0 = disabled (hard switch).
    chunk_blend_actions: 0

    # Inter-action interpolation: smooth 100Hz output by interpolating
    # between consecutive actions in the chunk.
    interpolate_actions: true

    # CSV log path for action diagnostics (empty = disabled)
    # Logs raw, smoothed, final actions and state at 100 Hz
    csv_log_path: "/tmp/groot_client_debug.csv"

    # ==========================================================================
    # Back Initialization
    # ==========================================================================
    # Height (meters) to move the back to on startup (0.0 to 0.390).
    # Will calibrate the back first if not already calibrated.
    # Set to -1.0 to disable back initialization entirely.
    back_init_height: 0.1

    # ==========================================================================
    # Debug Settings
    # ==========================================================================
    # Save first few observation images to /tmp/groot_debug_images/ for
    # visual comparison with training data (helps diagnose domain gap)
    debug_save_images: true

