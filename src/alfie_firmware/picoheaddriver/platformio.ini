; PlatformIO Project Configuration File
;
; picoheaddriver - RP2040-Zero head module driver
;   - 3 Feetech ST/SMS serial bus servos (Waveshare Bus Servo Adapter A, UART0)
;   - 2 eye LEDs via TB6612FNG (PWM @ 100 Hz)
;   - onboard WS2812 status/heartbeat LED
;   - micro-ROS over USB serial (humble)
;
; https://docs.platformio.org/page/projectconf.html

[env:head]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
board_microros_distro = humble
board_microros_transport = serial
monitor_speed = 115200

; Pinned to the stable udev symlink so uploads never target the wrong pico,
; regardless of ttyACM* enumeration order.
upload_port  = /dev/ttyAlfieH
monitor_port = /dev/ttyAlfieH

extra_scripts =
    pre:fix_atomic.py
    post:reboot_after_upload.py

build_flags =
    -I include
    -I lib/scservo
    -I lib/ws2812
    -URMW_UXRCE_MAX_NODES         -DRMW_UXRCE_MAX_NODES=1
    -URMW_UXRCE_MAX_PUBLISHERS    -DRMW_UXRCE_MAX_PUBLISHERS=1
    -URMW_UXRCE_MAX_SUBSCRIPTIONS -DRMW_UXRCE_MAX_SUBSCRIPTIONS=1
    -URMW_UXRCE_MAX_SERVICES      -DRMW_UXRCE_MAX_SERVICES=0
    -URMW_UXRCE_MAX_CLIENTS       -DRMW_UXRCE_MAX_CLIENTS=1
    -URMW_UXRCE_MAX_HISTORY       -DRMW_UXRCE_MAX_HISTORY=1
    -Wno-unused-result
    -Wno-ignored-qualifiers
build_unflags = -fno-rtti

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git#ed22dfe
