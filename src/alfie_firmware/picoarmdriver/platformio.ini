; PlatformIO Project Configuration File
;
; picoarmdriver - RP2040-Zero arm driver (identical firmware on both arms)
;   - 7 Feetech ST/SMS serial bus servos = 6 logical joints (shoulder-pitch is a
;     mirrored 2-servo coupled pair). Waveshare Bus Servo Adapter A on UART0.
;   - onboard WS2812 status/heartbeat LED
;   - micro-ROS over USB serial (humble)
;   - reads the Pico unique board serial at boot to decide left vs right arm
;
; https://docs.platformio.org/page/projectconf.html

; Common configuration shared by both arms. This is a plain section (not an
; env), so it is never built directly - the left/right envs below inherit it
; via `extends` and only add their upload/monitor port.
[arm_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
board_microros_distro = humble
board_microros_transport = serial
monitor_speed = 115200

extra_scripts =
    pre:fix_atomic.py
    post:reboot_after_upload.py

build_flags =
    -I include
    -I lib/scservo
    -I lib/ws2812
    -URMW_UXRCE_MAX_NODES         -DRMW_UXRCE_MAX_NODES=1
    -URMW_UXRCE_MAX_PUBLISHERS    -DRMW_UXRCE_MAX_PUBLISHERS=1
    -URMW_UXRCE_MAX_SUBSCRIPTIONS -DRMW_UXRCE_MAX_SUBSCRIPTIONS=1
    -URMW_UXRCE_MAX_SERVICES      -DRMW_UXRCE_MAX_SERVICES=0
    -URMW_UXRCE_MAX_CLIENTS       -DRMW_UXRCE_MAX_CLIENTS=1
    -URMW_UXRCE_MAX_HISTORY       -DRMW_UXRCE_MAX_HISTORY=1
    -Wno-unused-result
    -Wno-ignored-qualifiers
build_unflags = -fno-rtti

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git#ed22dfe

; Per-arm envs. Same firmware, distinguished only by which board they upload to.
; The board reads its own unique serial at boot to decide left vs right.
;   pio run -e left  -t upload    (or pick the env in the VSCode PIO task list)
;   pio run -e right -t upload
[env:left]
extends = arm_base
upload_port  = /dev/ttyAlfieL
monitor_port = /dev/ttyAlfieL

[env:right]
extends = arm_base
upload_port  = /dev/ttyAlfieR
monitor_port = /dev/ttyAlfieR
